
services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: siem-namenode
    hostname: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      CLUSTER_NAME: siem-cluster
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
    volumes:
      - siem_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: siem-datanode
    hostname: datanode
    restart: unless-stopped
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
    volumes:
      - siem_datanode:/hadoop/dfs/data


  spark:
    image: apache/spark:3.5.3
    container_name: siem-spark
    hostname: spark
    depends_on:
      - namenode
      - datanode
    ports:
      - "4040:4040"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./spark/jobs:/opt/siem/jobs
    command: ["/bin/bash", "-lc", "sleep infinity"]

volumes:
  siem_namenode:
  siem_datanode:
